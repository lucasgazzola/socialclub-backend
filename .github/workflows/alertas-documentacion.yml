# US-26 — Aviso diario por email de las alertas de documentación.
#
# La API escala a cero (minReplicas 0), así que un cron dentro de Nest no
# correría. Este workflow la despierta una vez por día y llama al endpoint
# protegido con el token; la API decide qué alertas son nuevas y las envía.
#
# Usa secrets de REPOSITORIO (no de environment): el environment `production`
# tiene aprobación manual y frenaría la ejecución diaria. El token de cada
# entorno tiene que ser el mismo que su ALERTAS_CRON_TOKEN (ver DESPLIEGUE.md).
# GitHub solo ejecuta los `schedule` desde la rama por defecto (main).
name: Alertas de documentación

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 en Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entorno: [TEST, MAIN]
    steps:
      - name: Avisar alertas nuevas (${{ matrix.entorno }})
        env:
          API_URL: ${{ secrets[format('ALERTAS_API_URL_{0}', matrix.entorno)] }}
          TOKEN: ${{ secrets[format('ALERTAS_CRON_TOKEN_{0}', matrix.entorno)] }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::Alertas sin configurar para ${{ matrix.entorno }}; se omite."
            exit 0
          fi
          # --max-time alto + reintentos: el primer request despierta la réplica (cold start).
          curl --fail-with-body -sS --max-time 120 --retry 3 --retry-all-errors --retry-delay 20 \
            -X POST "$API_URL/api/v1/alertas/documentacion/notificar" \
            -H "x-cron-token: $TOKEN"
