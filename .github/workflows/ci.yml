# CI — se ejecuta en Pull Requests a dev/test/main y en push a dev.
# Valida lint + tests + build. NO despliega.
name: CI

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres efímero y descartable: lo usa `prisma migrate diff` como shadow
    # database en el chequeo de drift de abajo (se borra y se recrea por corrida).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: socialclub
          POSTGRES_PASSWORD: socialclub
          POSTGRES_DB: socialclub_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialclub -d socialclub_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      # Falla si `prisma/schema.prisma` tiene objetos sin migración versionada.
      # El entrypoint de Docker/test/prod aplica `migrate deploy`, NO `db push`:
      # un modelo o una columna sin migración compila, pasa los tests y recién
      # revienta en runtime con "column X does not exist" (DT-37).
      - name: Verificar drift schema.prisma ↔ migraciones
        run: npm run prisma:check-drift

      - name: Lint
        run: npm run lint

      # Base de integración (DT-25): migraciones aplicadas de cero sobre el
      # mismo Postgres efímero. La usan los tests que necesitan la base real,
      # como los triggers que vuelven inalterable la auditoría.
      - name: Base de integración (migrate deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://socialclub:socialclub@localhost:5432/socialclub_integracion?schema=public

      # Corre los tests con cobertura. El umbral (ratchet) está en package.json > jest.coverageThreshold.
      # Piso actual sobre lógica de negocio (services + controllers); objetivo DoD: 70%.
      # Subir el ratchet a medida que /casos-a-tests agregue tests.
      - name: Tests + cobertura (Jest)
        run: npm run test:cov
        env:
          DB_INTEGRACION_URL: postgresql://socialclub:socialclub@localhost:5432/socialclub_integracion?schema=public

      - name: Publicar cobertura (evidencia de ejecución)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/
          if-no-files-found: warn

      - name: Build
        run: npm run build
